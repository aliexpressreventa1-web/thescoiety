<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Society · Lecture Portal</title>
  <meta name="description" content="The Society Curriculum — watch each lecture in order to understand the model completely." />
  <meta name="theme-color" content="#14181f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem("society.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="back-link" id="mainSiteLink" href="#"><span aria-hidden="true">←</span> Main site</a>
        <div class="brand-text">
          <span class="brand-top" id="brandTop">THE SOCIETY</span>
          <span class="brand-bottom" id="brandBottom">Lecture Portal</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="card hero">
      <h1 id="siteTitle">The Society Curriculum</h1>
      <p class="hero-sub" id="siteSubtitle"></p>
      <div class="progress-head">
        <span>Progress</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-count" id="progressCount">0/0 lessons completed</p>
    </section>

    <section class="layout">
      <aside class="sidebar" aria-label="Curriculum">
        <div class="saved" id="savedBox">
          <button class="saved-head" type="button" id="savedToggle" aria-expanded="true">
            <span class="saved-title">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              Saved Lessons <span class="saved-count" id="savedCount">0</span>
            </span>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="saved-body" id="savedBody"></div>
        </div>

        <nav id="moduleList" class="module-list"></nav>
      </aside>

      <article class="card lesson" id="lessonPanel" aria-live="polite"></article>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/thumbs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
